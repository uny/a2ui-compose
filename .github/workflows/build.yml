name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS so the Apple targets are actually compiled — on ubuntu they are silently skipped
    # (kotlin.native.ignoreDisabledTargets=true), which turns a green build into a vacuous one.
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Check public API
        run: ./gradlew checkLegacyAbi --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: '**/build/reports/**'
          retention-days: 7
