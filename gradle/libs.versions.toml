[versions]
# The Kotlin floor is the line the current stable Compose Multiplatform is built on, read from its
# klib manifests (`compiler_version = 2.3.20` for 1.12.0): lower buys no consumer, higher locks out
# ones Compose itself admits. It moves to 2.4 with the first Compose Multiplatform stable built on
# Kotlin 2.4, and not with a Dependabot bump -- decline those until then. See #64 and the README.
# The move is one PR: this line, the Kotlin-minor `ignore` in `.github/dependabot.yml`, the
# `api/android` dumps back under each module (the 2.4 tool writes and checks them; 2.3's does not),
# the `api/jvm` dumps re-dumped (the two tools list different lines, #89), and
# `kotlin-js-store/yarn.lock` regenerated (`kotlinUpgradeYarnLock`), which moves with the plugin.
kotlin = "2.3.21"
agp = "9.4.1"
composeMultiplatform = "1.12.0"
# material3 ships on its own version line, independent of the Compose Multiplatform release.
composeMaterial3 = "1.9.0"
coroutines = "1.11.0"
serialization = "1.11.0"
publish = "0.37.0"
dokka = "2.2.0"
# The Markdown parser `a2ui-material3-markdown` builds on. Publishes every target this repository does.
jetbrainsMarkdown = "0.7.14"

# The published floor: this becomes `minCompileSdk` in the AAR metadata, so it is what every
# Android consumer must compile against. Kept as low as our own dependencies allow — 37 is forced
# by androidx.compose 1.12.0, which Compose Multiplatform 1.12.0 pulls in on Android.
android-compileSdk = "37"
android-minSdk = "24"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# Compose Multiplatform artifacts are declared explicitly: the `compose.runtime` shorthand on the
# plugin extension is deprecated as of CMP 1.12.
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
jetbrains-markdown = { module = "org.jetbrains:markdown", version.ref = "jetbrainsMarkdown" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "publish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
