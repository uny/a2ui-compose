name: build

on:
  push:
    branches: [main]
  pull_request:

# What the token may do, and how long it sticks around. Nothing here writes to the repository --
# the jobs check out, build, and upload a failure artifact, and that upload authenticates with the
# runtime token rather than this one -- and no step runs an authenticated git command, which is why
# every checkout below also drops the credential rather than leaving it in `.git/config` for the
# length of a build that runs this repository's own Gradle scripts and yarn-resolved npm packages.
#
# The repository default is already read-only; written down rather than relied upon, because a
# default is a setting someone can change without touching this file.
permissions:
  contents: read

# Actions are pinned to a commit, not to `@v5`. A major-version tag is a moving pointer the action's
# owner can repoint at any commit, and these run with the repository checked out; the trailing
# comment is the release that commit was, since the hash alone says nothing about how old it is.
# To move one deliberately:
#
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
#
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Three Gradle jobs rather than one, split by *backend* rather than by module or by test. (A
# fourth job, `scripts`, runs no Gradle at all and is outside this accounting.)
#
# 58% of this build's wall-clock is linking test binaries; running the tests themselves is 6% and
# compiling is under 2%. The unit of cost is therefore "one test executable per target", not "one
# test", which is why the split is by target and why filtering tests would not have helped.
#
# The three shares are close to even -- JS 10.2m, wasmJs 11.1m, Apple 9.5m of a 35m build -- and
# splitting JS from wasmJs is what makes the difference: they are 60% of the build between them, so
# a two-job "Apple / everything else" split would have left one job holding 21 of the 35 minutes.
#
# The union of the three jobs' task graphs is exactly the task graph of the single
# `build checkLegacyAbi` this replaces -- 858 tasks, verified with `--dry-run` and a set difference.
# Nothing stopped being verified. Re-run that check when changing any of the command lines below:
#
#   ./gradlew <job's arguments> --dry-run | grep -oE '^:[a-zA-Z0-9:_-]+' | sort -u
#
# and confirm the three results still cover `./gradlew build checkLegacyAbi --dry-run`.

jobs:
  # Everything that is not a web backend: the Apple targets, JVM, Android, the metadata and
  # publication artifacts, and the public API check.
  #
  # macOS, because on Linux the Apple targets are silently skipped -- `kotlin.native.ignoreDisabledTargets=true`
  # turns them off rather than failing -- and a green build that skipped them says nothing.
  #
  # `checkLegacyAbi` belongs here for the same reason and not merely by convenience: the checked-in
  # klib dump covers `[iosArm64, iosSimulatorArm64, js, macosArm64, wasmJs]`, so on Linux the
  # regenerated dump would be missing three targets and the check would compare against something
  # the build cannot produce.
  apple:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # `build` minus the two web backends' test executables and production bundles, which the
      # other two jobs own. The web *libraries* are still compiled here, because `assemble` builds
      # them and they are cheap -- it is the executables that cost.
      - name: Build
        run: >
          ./gradlew build checkLegacyAbi
          -x jsTest -x jsBrowserTest -x wasmJsTest -x wasmJsBrowserTest
          -x jsBrowserDistribution -x wasmJsBrowserDistribution
          -x compileProductionExecutableKotlinJs
          -x compileProductionExecutableKotlinWasmJs
          -x compileProductionExecutableKotlinWasmJsOptimize
          --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-apple
          path: '**/build/reports/**'
          retention-days: 7

  # Kotlin/JS: the browser tests and the production bundle.
  #
  # Ubuntu rather than macOS, and safely so: this job names only JS tasks, so there is no Apple
  # target for the runner to skip. If one were named and the target were disabled, Gradle would
  # fail with an unknown task rather than pass having done nothing -- which is the property that
  # makes splitting off a Linux runner safe at all.
  js:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Test
        run: ./gradlew jsTest jsBrowserDistribution --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-js
          path: '**/build/reports/**'
          retention-days: 7

  # Kotlin/Wasm: the browser tests and the production bundle. The heaviest single share, and the
  # only place the Compose UI tests run in a browser -- the JS harness cannot boot Skiko, so those
  # tests are excluded from the `js` target's source set.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Test
        run: ./gradlew wasmJsTest wasmJsBrowserDistribution --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-wasm
          path: '**/build/reports/**'
          retention-days: 7

  # The shell that CI otherwise never reaches, and the workflow files themselves.
  #
  # `cd.yml` runs only on a `v*` tag, so the scripts it stands on -- the credential check in front
  # of an irreversible publish, the signature check behind it -- would first execute during a real
  # release. Their `.test.sh` files execute them here instead, on every PR. A glob rather than a
  # list, so a script added beside them with a test is covered by adding the test and nothing else:
  # `check-published-signed.test.sh` arrived in #67 with no step to run it, and had never run in CI
  # until this one. Seconds either way, and deliberately not folded into `apple`: a shell
  # regression should not be reported as a Kotlin failure.
  #
  # Both runners, because this shell only ever *executes* on macOS -- `cd.yml` and
  # `release-dry-run.yml` are both `macos-15` -- while ubuntu is where a contributor's shell
  # instincts come from. Testing only on ubuntu would leave BSD `find`/`sed` and bash 3.2
  # unexercised, so a GNU-only construct added later (`grep -P`, `sed -i` without a suffix,
  # `readlink -f`) would stay green here and fail for the first time during the release this gate
  # exists to protect.
  #
  # `actionlint` on one of the two, for the YAML around the scripts: expression types, `needs:`
  # names, runner labels, and -- through `shellcheck`, which it finds on the runner's PATH -- every
  # `run:` block, including the ones in the two workflows this job cannot otherwise execute. Two
  # of the defects #54's review found by hand were in a `run:` block and both passed `actionlint`
  # and `shellcheck`, which is why the tests above exist as well; this catches the class of
  # mistake they do not, a workflow that GitHub would refuse or misread.
  #
  # Fetched as a release tarball checked against a sha256 rather than through a wrapper action:
  # the wrapper would be one more third party's code running with the repository checked out, and
  # the pin below is to the bytes, which is stricter than a commit. Recorded from the release's
  # own `actionlint_<version>_checksums.txt`, and cross-checked against an independent download.
  # To move it: fetch the new tarball, verify it the same way, and replace both values.
  scripts:
    name: scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test every release script
        run: |
          for test in .github/scripts/*.test.sh; do
            echo "::group::$test"
            sh "$test"
            echo "::endgroup::"
          done

      - name: Lint the workflows
        if: runner.os == 'Linux'
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/actionlint.tar.gz" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color

  # One check to require, so that a branch rule naming `build` keeps meaning "all of it".
  #
  # `always()` with an explicit result test rather than the default: without it a cancelled or
  # skipped upstream job leaves this one skipped, and a skipped required check reads as satisfied.
  #
  # Every job is named twice below, in `needs:` and in the test, and both are load-bearing: a job
  # added to `needs:` alone is waited for and then ignored, since `always()` runs this step whatever
  # the result was.
  build:
    needs: [apple, js, wasm, scripts]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check the three backends and the scripts passed
        run: |
          echo "apple=${{ needs.apple.result }} js=${{ needs.js.result }} wasm=${{ needs.wasm.result }} scripts=${{ needs.scripts.result }}"
          [ "${{ needs.apple.result }}" = "success" ] \
            && [ "${{ needs.js.result }}" = "success" ] \
            && [ "${{ needs.wasm.result }}" = "success" ] \
            && [ "${{ needs.scripts.result }}" = "success" ]
