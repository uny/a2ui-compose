[versions]
kotlin = "2.4.10"
agp = "9.3.2"
composeMultiplatform = "1.12.0"
# material3 ships on its own version line, independent of the Compose Multiplatform release.
composeMaterial3 = "1.9.0"
coroutines = "1.11.0"
serialization = "1.11.0"
publish = "0.37.0"

# The published floor: this becomes `minCompileSdk` in the AAR metadata, so it is what every
# Android consumer must compile against. Kept as low as our own dependencies allow — 37 is forced
# by androidx.compose 1.12.0, which Compose Multiplatform 1.12.0 pulls in on Android.
android-compileSdk = "37"
android-minSdk = "24"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# Compose Multiplatform artifacts are declared explicitly: the `compose.runtime` shorthand on the
# plugin extension is deprecated as of CMP 1.12.
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "publish" }
