# 6G rather than the 4G this started at. The Kotlin compile daemon inherits this line, and the
# Kotlin/JS and Kotlin/Wasm *executables* are what need it: those link the whole composition --
# Compose UI, Material 3, Skiko -- into one IR binary, and the Gallery's grew past 4G when it moved
# onto `a2ui-material3`. The symptom is `OutOfMemoryError: GC overhead limit exceeded` inside
# `compileProductionExecutableKotlinJs`, which no source change explains.
#
# Raised here rather than in `kotlin.daemon.jvmargs`. Setting that property replaces KGP's own
# daemon arguments instead of adding to them, and doing so made *more* tasks fail at the same
# heap size than leaving it unset.
org.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8
org.gradle.caching=true
# Configuration cache is OFF on purpose. Kotlin Multiplatform does not fully support it yet —
# MetadataDependencyTransformationTask fails to serialize locally, and on CI a restored
# configuration cache skips the Kotlin/JS + Kotlin/Wasm npm setup, leaving wasmJsBrowserTest
# unable to find kotlin-web-helpers. Revisit once KGP supports it cleanly.
# org.gradle.configuration-cache=true
org.gradle.parallel=true

kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Compose Multiplatform: opt in to the experimental targets we ship (macOS, JS, wasm)
org.jetbrains.compose.experimental.macos.enabled=true

