name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS so the Apple targets are actually compiled — on ubuntu they are silently skipped
    # (kotlin.native.ignoreDisabledTargets=true), which turns a green build into a vacuous one.
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # setup-gradle restores the Gradle build cache but not ~/.kotlin, where the Kotlin/JS and
      # Kotlin/Wasm npm tooling actually lives. Without this the second run onwards resolves
      # kotlinNpmInstall from the build cache while node_modules is absent on disk, and the
      # browser tests fail with "Cannot find node module kotlin-web-helpers/...". Keyed on the
      # committed yarn locks so the two caches move together.
      - name: Cache Kotlin npm tooling
        uses: actions/cache@v4
        with:
          path: ~/.kotlin
          key: kotlin-npm-${{ runner.os }}-${{ hashFiles('kotlin-js-store/**/yarn.lock') }}

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Check public API
        run: ./gradlew checkLegacyAbi --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: '**/build/reports/**'
          retention-days: 7
